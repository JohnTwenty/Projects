    - id: amb_close_assault_tie_facing
      title: Close assault tie result when defender is already facing the attacker
      status: unresolved
      ambiguity_type: textual
      severity: low
      rule_area: close_assault
      description: The rulebook states that if the defender wins or ties and is NOT facing the attacker, the defender is turned to face. It does not explicitly state what happens on a tie when the defender IS already facing the attacker.
      source_refs: [rulebook_close_assault_effects_section]
      candidate_interpretations:
        - id: amb_cat_i1
          label: Tie + defender facing = no effect, no casualties
          interpretation: The "neither side has won" tie rule applies generally. Since the defender is already facing, the facing-change outcome has no effect. No model is killed.
        - id: amb_cat_i2
          label: Tie + defender facing = defender killed (attacker wins ties when defender faces)
          interpretation: The facing condition only modifies the "defender wins" outcome. On a tie the attacker is considered to have won.
      chosen_resolution:
        resolution_status: provisional
        resolution_summary: >-
          Interpretation i1 adopted as provisional ruling: a tie always results in no casualties,
          regardless of whether the defender is already facing the attacker. The "neither side has
          won; no damage is done" rule is absolute. The "defender turns to face" outcome is the
          consequence of the defender winning, not of tying. Since the rulebook text explicitly
          resolves ties as neutral, interpretation i2 would require positive textual support that
          is absent.
        provenance: house_rule
        confidence: medium
        notes:
          - "Interpretation i2 was considered but rejected: it requires reading 'attacker wins on ties when defender faces' into text that says no such thing. i1 is the more conservative reading."
          - "If an official FAQ or errata emerges, supersede this record with the canonical ruling."
      related_rule_ids: [res_close_assault]
