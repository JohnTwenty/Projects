$schema_version: 0.1.0
$id: gamespecs/state.schema.yaml
kind: state_schema
metadata:
  name: Generic Game State Schema
  purpose: >-
    Canonical schema for representing tabletop and board game state in a way that
    cleanly separates explicit physical state from supplemental implicit state
    required for digital execution, validation, and agentic reasoning.
  design_principles:
    - Preserve a distinction between physical game reality and implementation support state.
    - Support persistent, ephemeral, derived, and historical state.
    - Allow traceability back to source rules.
    - Stay generic enough for multiple games while supporting game-specific extensions.

spec_document_schema:
  type: object
  required:
    - spec_version
    - game
    - state_model
  properties:
    spec_version:
      type: string
      description: Version of the authored state spec document.
    game:
      $ref: '#/$defs/game_identity'
    imports:
      type: array
      items:
        type: string
      description: Optional references to shared fragments or base specs.
    metadata:
      $ref: '#/$defs/metadata'
    state_model:
      $ref: '#/$defs/state_model'
    source_trace:
      type: array
      items:
        $ref: '#/$defs/source_trace_entry'
    notes:
      type: array
      items:
        type: string

$defs:
  game_identity:
    type: object
    required:
      - id
      - title
    properties:
      id:
        type: string
      title:
        type: string
      edition:
        type: string
      publisher:
        type: string
      source_version:
        type: string

  metadata:
    type: object
    properties:
      authors:
        type: array
        items:
          type: string
      status:
        type: string
        enum: [draft, review, stable, deprecated]
      created_at:
        type: string
      updated_at:
        type: string
      description:
        type: string
      tags:
        type: array
        items:
          type: string

  state_model:
    type: object
    required:
      - physical_state
      - supplemental_state
    properties:
      physical_state:
        $ref: '#/$defs/physical_state'
      supplemental_state:
        $ref: '#/$defs/supplemental_state'
      shared_types:
        type: array
        items:
          $ref: '#/$defs/type_definition'
      invariants:
        type: array
        items:
          $ref: '#/$defs/invariant'
      entity_instances:
        type: array
        items:
          $ref: '#/$defs/entity_instance'
        description: >-
          Concrete entity instances with starting attribute values. Leave empty
          in core rules files. Populate in scenario/mission files or for
          serialised live game state.

  physical_state:
    type: object
    description: >-
      State corresponding to things that exist in the box, on the board, on cards,
      on miniatures, or as player-visible markers/counters during physical play.
    properties:
      entity_types:
        type: array
        items:
          $ref: '#/$defs/entity_type'
      zones:
        type: array
        items:
          $ref: '#/$defs/zone_definition'
      resources:
        type: array
        items:
          $ref: '#/$defs/resource_definition'
      relations:
        type: array
        items:
          $ref: '#/$defs/relation_definition'
      topology:
        $ref: '#/$defs/topology_definition'
        description: >-
          Optional formal spatial model for the board. Define when LOS, movement
          legality, or adjacency cannot be derived from a simple uniform grid.

  supplemental_state:
    type: object
    description: >-
      State required for implementation, formal reasoning, or validation that may
      be only implicit in the physical game and rulebook.
    properties:
      turn_state:
        type: array
        items:
          $ref: '#/$defs/state_variable'
      phase_state:
        type: array
        items:
          $ref: '#/$defs/state_variable'
      derived_state:
        type: array
        items:
          $ref: '#/$defs/state_variable'
      ephemeral_resolution_state:
        type: array
        items:
          $ref: '#/$defs/state_variable'
      historical_state:
        type: array
        items:
          $ref: '#/$defs/state_variable'
      hidden_information_state:
        type: array
        items:
          $ref: '#/$defs/state_variable'
      implementation_notes:
        type: array
        items:
          type: string

  entity_type:
    type: object
    required:
      - id
      - category
      - attributes
    properties:
      id:
        type: string
      name:
        type: string
      category:
        type: string
        description: >-
          Broad physical category such as miniature, token, tile, door, card,
          marker, dice, template, or board_feature.
      plurality:
        type: string
        enum: [singleton_type, repeatable_type]
      attributes:
        type: array
        items:
          $ref: '#/$defs/attribute_definition'
      visible_to:
        $ref: '#/$defs/visibility_rule'
      represented_in_box:
        type: boolean
        description: True if the entity exists as a physical component.
      source_refs:
        type: array
        items:
          type: string
      notes:
        type: array
        items:
          type: string

  state_variable:
    type: object
    required:
      - id
      - state_class
      - value_type
    properties:
      id:
        type: string
      name:
        type: string
      state_class:
        type: string
        enum:
          - turn_state
          - phase_state
          - derived_state
          - ephemeral_resolution_state
          - historical_state
          - hidden_information_state
      scope:
        type: string
        enum:
          - game
          - player
          - side
          - scenario
          - zone
          - entity
          - action_resolution
      value_type:
        $ref: '#/$defs/value_type'
      cardinality:
        type: string
        enum: [single, list, set, map, stack, queue, pool, deck]
        description: >-
          single: one value. list: ordered sequence, duplicates allowed.
          set: unordered, no duplicates. map: key-value pairs.
          stack: ordered, LIFO access. queue: ordered, FIFO access.
          pool: unordered bag; draw_random removes a random element without
          replacement (e.g. command counter tiles, blip counters).
          deck: ordered; draw_top removes from the front, draw_bottom from the
          back (e.g. card decks with known ordering).
      initial_value:
        description: Optional default value or initialization expression.
      persistence:
        type: string
        enum: [persistent, transient, turn_scoped, phase_scoped, resolution_scoped]
      visibility:
        $ref: '#/$defs/visibility_rule'
      derived_from:
        type: array
        items:
          type: string
        description: IDs of rules, entities, or variables from which this value is derived.
      required_for:
        type: array
        items:
          type: string
        description: IDs of procedures, rules, or validations that depend on this state variable.
      represented_physically:
        type: boolean
        description: False for implementation-only or inferred state.
      source_refs:
        type: array
        items:
          type: string
      notes:
        type: array
        items:
          type: string

  attribute_definition:
    type: object
    required:
      - id
      - value_type
    properties:
      id:
        type: string
      name:
        type: string
      value_type:
        $ref: '#/$defs/value_type'
      cardinality:
        type: string
        enum: [single, list, set, map]
      required:
        type: boolean
      default:
        description: Optional default value.
      mutable:
        type: boolean
      visibility:
        $ref: '#/$defs/visibility_rule'
      represented_physically:
        type: boolean
      source_refs:
        type: array
        items:
          type: string
      notes:
        type: array
        items:
          type: string

  value_type:
    oneOf:
      - type: string
        enum:
          - boolean
          - integer
          - number
          - string
          - text
          - identifier
          - direction
          - position
          - distance
          - range
          - enum
          - record
          - reference
          - dice_result
          - timestamp
      - type: object
        properties:
          enum_name:
            type: string
          values:
            type: array
            items:
              type: string
          direction_source:
            type: string
            enum: [topology_direction_values]
            description: >-
              Binds this direction attribute or variable to the valid values
              enumerated in the enclosing spec's topology_definition.direction_values.
              Use instead of (or alongside) an inline values list so validators
              can resolve legal facing values from the topology definition.
          record_name:
            type: string
          fields:
            type: array
            items:
              $ref: '#/$defs/attribute_definition'
          reference_target:
            type: string

  visibility_rule:
    oneOf:
      - type: string
        enum:
          - public
          - owner_only
          - controller_only
          - gm_only
          - hidden
          - mixed
      - type: object
        properties:
          mode:
            type: string
            enum:
              - public
              - owner_only
              - controller_only
              - gm_only
              - hidden
              - mixed
          visible_to_roles:
            type: array
            items:
              type: string
          notes:
            type: array
            items:
              type: string

  type_definition:
    type: object
    required:
      - id
    properties:
      id:
        type: string
      description:
        type: string
      kind:
        type: string
        enum: [enum, record, alias]
      values:
        type: array
        items:
          type: string
      fields:
        type: array
        items:
          $ref: '#/$defs/attribute_definition'
      target:
        type: string

  zone_definition:
    type: object
    required:
      - id
    properties:
      id:
        type: string
      name:
        type: string
      kind:
        type: string
      capacity:
        type: string
      attributes:
        type: array
        items:
          $ref: '#/$defs/attribute_definition'
      source_refs:
        type: array
        items:
          type: string

  resource_definition:
    type: object
    required:
      - id
      - value_type
    properties:
      id:
        type: string
      name:
        type: string
      owner_scope:
        type: string
        enum: [game, player, side, scenario, entity]
      value_type:
        $ref: '#/$defs/value_type'
      represented_physically:
        type: boolean
      source_refs:
        type: array
        items:
          type: string

  relation_definition:
    type: object
    required:
      - id
      - from
      - to
    properties:
      id:
        type: string
      from:
        type: string
      to:
        type: string
      multiplicity:
        type: string
        enum: [one_to_one, one_to_many, many_to_one, many_to_many]
      attributes:
        type: array
        items:
          $ref: '#/$defs/attribute_definition'
      source_refs:
        type: array
        items:
          type: string

  invariant:
    type: object
    required:
      - id
      - statement
    properties:
      id:
        type: string
      statement:
        type: string
      severity:
        type: string
        enum: [error, warning]
      source_refs:
        type: array
        items:
          type: string
      notes:
        type: array
        items:
          type: string

  source_trace_entry:
    type: object
    required:
      - id
      - source_id
      - target_ids
    properties:
      id:
        type: string
      source_id:
        type: string
      target_ids:
        type: array
        items:
          type: string
      trace_kind:
        type: string
        enum:
          - explicit
          - implicit
          - inferred_for_execution
          - inferred_for_validation
      justification:
        type: string
      notes:
        type: array
        items:
          type: string

  entity_instance:
    type: object
    required:
      - id
      - type_id
    properties:
      id:
        type: string
        description: Unique identifier for this instance within the document.
      type_id:
        type: string
        description: References an entity_type.id defined in this or an imported state spec.
      zone_id:
        type: string
        description: Zone this instance starts in, if applicable.
      attribute_values:
        type: array
        items:
          $ref: '#/$defs/attribute_value'
      source_refs:
        type: array
        items:
          type: string
      notes:
        type: array
        items:
          type: string

  attribute_value:
    type: object
    required:
      - attribute_id
      - value
    properties:
      attribute_id:
        type: string
        description: References an attribute_definition.id on the parent entity_type.
      value:
        description: Concrete value. Must be compatible with the attribute's value_type.
      source_refs:
        type: array
        items:
          type: string

  topology_definition:
    type: object
    description: >-
      Formal description of the board's spatial structure. Required for games
      where LOS, movement legality, or range cannot be derived from a simple
      uniform grid assumption.
    properties:
      topology_kind:
        type: string
        enum: [grid_2d, hex_grid, graph, free_form]
      coordinate_system:
        type: string
        description: >-
          Identifies the coordinate scheme used by the position value_type.
          E.g. "xy_integer" (position resolves to {x: integer, y: integer})
          or "named_square_id" (position resolves to a string square identifier).
      position_type:
        type: object
        description: >-
          Defines the concrete field structure of a position value for this game.
          For xy_integer grids specify {x: integer, y: integer}. For
          named_square_id grids specify {square_id: string}. This resolves the
          otherwise opaque position value_type primitive into something a code
          generator or validator can work with.
        additionalProperties:
          type: string
          enum: [integer, string, number]
      direction_values:
        type: array
        items:
          type: string
        description: >-
          Enumerates all legal facing/direction values. Required when the
          direction value_type is used. E.g. [north, south, east, west].
      adjacency_rules:
        type: array
        items:
          $ref: '#/$defs/adjacency_rule'
      los_definition:
        $ref: '#/$defs/los_definition'
        description: >-
          Optional formal line-of-sight model. Required for games where LOS is
          computed algorithmically rather than described purely in prose rules.
          Specifies the algorithm family and its key behavioural parameters so
          that a code generator can produce a correct implementation without
          embedding source code in the spec.
      source_refs:
        type: array
        items:
          type: string
      notes:
        type: array
        items:
          type: string

  adjacency_rule:
    type: object
    required:
      - id
      - rule_kind
    properties:
      id:
        type: string
      rule_kind:
        type: string
        enum: [orthogonal_only, orthogonal_and_diagonal, custom]
      applies_to:
        type: string
        description: Entity category or zone this rule applies to.
      notes:
        type: array
        items:
          type: string

  los_definition:
    type: object
    description: >-
      Declarative specification of the line-of-sight algorithm for a grid_2d
      topology. Captures the algorithm family and its key behavioural parameters
      so that a code generator can produce a correct, reproducible implementation
      without embedding source code in the spec.
    properties:
      algorithm:
        type: string
        enum: [bresenham_center_to_center, ray_cast, custom]
        description: >-
          The LOS algorithm family.
          bresenham_center_to_center: cast a ray from the center of the source
          cell to the center of the target cell using Bresenham's line algorithm;
          test each intermediate cell for obstruction.
          ray_cast: continuous ray from cell center; test boundary crossings.
          custom: algorithm described in notes only.
      symmetry:
        type: string
        enum: [required, not_required]
        description: >-
          required: LOS(A,B) == LOS(B,A) is an invariant. Implementations must
          enforce this, e.g. by running the check in both directions and ANDing
          the results. not_required: directional LOS is permitted.
      source_cell_excluded:
        type: boolean
        description: >-
          If true, the cell occupied by the observing model is never tested for
          obstruction (a model can always see out of its own square).
      target_cell_excluded:
        type: boolean
        description: >-
          If true, the target cell itself is never tested for obstruction (a
          model can always see into the cell it is targeting).
      corner_rule:
        type: string
        enum: [both_adjacent_corners_blocked, any_adjacent_corner_blocked, none]
        description: >-
          Governs diagonal ray steps — when the Bresenham algorithm advances in
          both x and y in a single iteration, the ray passes through a corner
          shared by four cells. The two cells orthogonally adjacent to that
          diagonal step are the "corner cells".
          both_adjacent_corners_blocked: LOS is blocked only if BOTH corner
          cells are obstructed; one clear corner lets the ray pass.
          any_adjacent_corner_blocked: LOS is blocked if either corner cell is
          obstructed. none: diagonal steps receive no special corner treatment.
      obstruction_sources:
        type: array
        items:
          $ref: '#/$defs/los_obstruction_source'
        description: >-
          Ordered list of obstruction categories tested against each intermediate
          cell along the ray. A cell is opaque if any source matches.
      notes:
        type: array
        items:
          type: string

  los_obstruction_source:
    type: object
    description: >-
      Identifies one category of cell obstruction for LOS calculations.
    properties:
      kind:
        type: string
        enum: [topology_wall, entity_type_unconditional, entity_type_conditional]
        description: >-
          topology_wall: walls encoded in the board tile/edge data always block.
          entity_type_unconditional: every instance of the named entity_type
          blocks LOS regardless of its state.
          entity_type_conditional: instances of the named entity_type block only
          when the given condition expression evaluates to true.
      entity_type:
        type: string
        description: >-
          References an entity_type.id. Required when kind is
          entity_type_unconditional or entity_type_conditional.
      condition:
        type: string
        description: >-
          Prose (or future structured) condition evaluated per instance.
          Required when kind is entity_type_conditional.
          E.g. "door.state == closed".
      notes:
        type: array
        items:
          type: string

$comment: "Authoring guidance moved to state_schema_guide.md to keep this file valid for JSON Schema validators."
